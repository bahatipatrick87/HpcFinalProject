# Pipeline configuration (user-customisable workflow, report §3.4).
# Read by every MPI rank at start-up; changes need no recompilation.

dataset:
  root: "data/EuroSAT"        # dataset folder
  target_width: 64            # every image is resized to 64x64
  target_height: 64

pipeline:
  channels: 3                 # RGB, fixed (for reference)
  # Stage DAG, run in this order; validated before any data is loaded:
  #   io (S1, CPU) -> fft (S2, GPU) -> filter (S3, GPU) -> feature (S4, CPU/OpenMP)
  # Remove or reorder entries to change the workflow, e.g. [io, fft, feature].
  stages:
    - io
    - fft
    - filter
    - feature
  # true: 3-thread pipeline (task parallelism); false: sequential stages.
  task_parallel_prefetch: true
  io_batch_size: 256          # images per batch
